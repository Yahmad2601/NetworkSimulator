kind = "web"
previewPath = "/"
title = "Cybersecurity Network Simulator"
version = "1.0.0"
id = "artifacts/network-simulator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21956

[services.development]
run = "pnpm --filter @workspace/network-simulator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/network-simulator", "run", "build" ]
publicDir = "artifacts/network-simulator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21956"
BASE_PATH = "/"
